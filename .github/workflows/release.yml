name: 'Release Job Command Center'

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify-macos-bundle:
    name: Verify packaged first use and sidecar lifecycle
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.2

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.16'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packaged macOS preflight
        run: >-
          pnpm run tauri build
          --config src-tauri/tauri.bundle.conf.json
          --bundles app
          --no-sign
          --ci

      - name: Verify disposable first use and sidecar lifecycle
        env:
          JCC_SMOKE_REQUIRE_SIDECAR: '1'
          JCC_SMOKE_RESTART_SIDECAR: '1'
          JCC_SMOKE_HOLD_SECONDS: '0'
          JCC_SMOKE_SIDECAR_WAIT_SECONDS: '40'
        run: >-
          scripts/smoke-disposable-release.sh
          "$PWD/src-tauri/target/release/bundle/macos/Job Command Center.app/Contents/MacOS/job-command-center"

  publish-tauri:
    needs: verify-macos-bundle
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--config src-tauri/tauri.bundle.conf.json --bundles app,dmg'
          - platform: 'windows-latest'
            args: '--config src-tauri/tauri.bundle.conf.json --bundles msi'
          - platform: 'ubuntu-22.04'
            args: '--config src-tauri/tauri.bundle.conf.json --bundles appimage'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.2

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.16'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and release
        uses: tauri-apps/tauri-action@dev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name || inputs.version }}
          releaseName: 'Job Command Center ${{ github.ref_name || inputs.version }}'
          releaseBody: |
            ## Job Command Center ${{ github.ref_name || inputs.version }}

            ### Installation Instructions
            - **macOS**: Download the `.dmg` file and drag to Applications folder
            - **Windows**: Download the `.msi` file and run the installer
            - **Linux**: Download the `.AppImage` file, make it executable (`chmod +x`), and run

            **Full Changelog**: https://github.com/${{ github.repository }}/commits/${{ github.ref_name || inputs.version }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
