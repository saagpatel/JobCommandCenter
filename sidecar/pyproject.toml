[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jcc-sidecar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "httpx==0.28.1",
    "pydantic>=2.0",
    "structlog==25.1.0",
    "keyring==25.6.0",
]

[project.scripts]
jcc-sidecar = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
